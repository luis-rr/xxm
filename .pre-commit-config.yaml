repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]

      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-src-tests-not-executable
        name: check src/tests not executable
        entry: bash -c 'bad=$(git ls-files -s src tests | grep "^100755 " || true); [ -z "$bad" ] || { echo "Executable files under src/ or tests/:"; echo "$bad"; exit 1; }'
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        types: [python]