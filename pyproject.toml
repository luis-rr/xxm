[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'xxm'
version = '0.1.0'
description = 'A lightweight JAX implementation of SLDS inference routines, inspired by ssm.'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.11'
dependencies = [
    'jax',
    'numpy',
]

[dependency-groups]
dev = [
    'pytest',
    'ruff',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']
